scope:
  plane: documentation
  note: >
    IMPORTANT — read this before treating the server as a Brandfolder data plane.
    This is a DOCUMENTATION/REFERENCE MCP server operated on Smartsheet's
    developer portal (Redocly-hosted). Its tools read the OpenAPI descriptions and
    docs pages published at developers.smartsheet.com; they do NOT call the
    Brandfolder v4 API and cannot create, read or modify a customer's assets. It
    is recorded for Brandfolder because a `list-apis` call with filter
    "brandfolder" returns exactly one API — "Brandfolder OpenAPI Reference",
    v4, servers https://brandfolder.com/api/v4 — so the Brandfolder contract is
    genuinely served by this endpoint.
  covered_apis:
    - Brandfolder OpenAPI Reference (v4)
  not_covered: >
    Asset/attachment/collection operations. There is no Brandfolder
    operations MCP server. Smartsheet separately ships a Smartsheet-product MCP
    server (developers.smartsheet.com/ai-mcp/smartsheet) whose documented tool
    list contains zero Brandfolder tools.
