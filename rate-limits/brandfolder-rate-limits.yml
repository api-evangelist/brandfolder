name: Brandfolder API Rate Limits
description: >
  Brandfolder publishes NO rate limits. Every page of the developer portal was
  read on 2026-08-13 - introduction, guides/basics (authentication, query
  parameters), recipes, error codes, changelog, insights data connector - and the
  only rate-limiting fact stated anywhere is that HTTP 429 means "You're sending
  too many requests in a short period of time." No threshold, no window, no
  scope, no burst allowance, no response headers, and no Retry-After. The
  OpenAPI declares no 429 response on any of its 73 operations. An integrator
  cannot size a workload against this API in advance, and an agent cannot read
  its remaining budget at runtime.
limit_count: 0
limits: []
exhaustion:
  status: 429
  documented_at: https://developers.smartsheet.com/api/brandfolder/error-codes
  meaning: You're sending too many requests in a short period of time.
  declared_in_openapi: false
headers:
  response: []
  response_note: >
    No RateLimit-Limit / RateLimit-Remaining / RateLimit-Reset, no
    X-RateLimit-*, and no Retry-After are documented or declared in the spec.
    Checked against the published OpenAPI - it defines no response headers at all.
  request:
    - name: Authorization
      description: Bearer API key, required on every request.
      example: 'Authorization: Bearer {BF_API_KEY}'
    - name: Content-Type
      description: application/json; declared a required header parameter on the webhook operations.
      example: 'Content-Type: application/json'
soft_limits_published:
  - name: per (page size)
    value: 3000
    default: 100
    scope: per request
    source: https://developers.smartsheet.com/api/brandfolder/guides/basics/query-parameters
    note: >
      The only hard published number in the API. It caps records per response,
      not requests per interval - it is a payload bound, not a rate limit, but it
      is the only quantitative ceiling Brandfolder states.
  - name: query-parameter cost warning
    value: null
    source: https://developers.smartsheet.com/api/brandfolder/guides/basics/query-parameters
    note: >
      The docs warn "Using these can slow down the API response time" for
      fields/include/search - a qualitative performance caution with no number.
recommendations:
  - Implement exponential backoff on 429; there is no Retry-After to honour.
  - Use per=3000 to reduce request count on large listings rather than paging at the 100 default.
  - Subscribe to asset.create/update/delete webhooks instead of polling for change detection (asyncapi/brandfolder-webhooks.yml).
  - Enterprise customers needing bulk reads should use the Insights Data Connector BigQuery export rather than the REST API.
  - Negotiate any required throughput in the contract - it is not a published property of the product.
