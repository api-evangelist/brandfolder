  /webhooks/send:
    parameters:
      - in: header
        name: Content-Type
        required: true
        schema:
          type: string
          enum:
            - application/json
        example: application/json
      - $ref: '#/components/parameters/Authorization'
    post:
      servers:
        - url: https://brandfolder.com/api/v1
      operationId: opIdApiV4WebhooksSendPost
      summary: Generate a test webhook
      description: >
        Generates a test Webhook.


        > **Important:** This operation uses server
        `https://brandfolder.com/api/v1` (notice the version is `v1`).


        > **Important:** Ensure that your code is able to receive a Brandfolder

        Webhook using this endpoint before creating a production Webhook

        subscription.


        If you receive a `202` response at this endpoint, then a fake Webhook

        notification will POST to your `callback_url`. If you don't receive
        anything

        at your `callback_url` within a few minutes, it is likely that

        `callback_url` is invalid. Please ensure the URL begins with `https://`
        and

        that it is a public domain (not `localhost`, behind a firewall, or any
        other

        domain requiring authentication) which can receive HTTP `POST` requests
        and

        respond with a `2xx` HTTP status code. 
      tags:
        - webhooks
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        event_type:
                          type: string
                          description: Event type.
                          enum:
                            - asset.create
                            - asset.update
                            - asset.delete
                          example: asset.create
                        resource_key:
                          type: string
                          description: Brandfolder ID.
                          example: oqgiju-21olts-ce9egi
                        resource_type:
                          type: string
                          description: >-
                            The type of resource the event acts on. Currently,
                            `brandfolder` is the only supported type.
                          example: brandfolder
                          enum:
                            - brandfolder
                        callback_url:
                          type: string
                          description: >
                            An HTTPS URL where webhook data will be posted.


                            Please ensure the URL begins with `https://` and
                            that it is a public domain (not `localhost`, behind
                            a firewall, or any other domain requiring
                            authentication) which can receive HTTP `POST`
                            requests and respond with a `2xx` HTTP status code.
                          example: https://your_company.com/your_callback_url
                        asset_key:
                          type: string
                          description: Asset ID override
                          example: oqgkkd-fr5iv4-443db
                        organization_key:
                          type: string
                          description: organization ID override.
                          example: oqgkkd-fr5iv4-cocc75
                      required:
                        - event_type
                        - resource_key
                        - resource_type
                        - callback_url
                  required:
                    - attributes
              required:
                - data
      responses:
        '202':
          description: |
            The webhook was successfully created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    default: Added demo webhook to queue
                  status:
                    type: string
                    default: ok
        '400':
          description: |
            Invalid Payload Provided
        '403':
          description: |
            Permission Denied for Provided Resource
        '404':
          description: |
            Provided Resource Does Not Exist
        '409':
          description: |
            Subscription Already Exists
        default:
          description: Generic error payload
          content:
            application/json:
              schema:
                type: string
