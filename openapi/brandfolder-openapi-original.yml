components:
  securitySchemes:
    APIToken:
      scheme: bearer
      type: http
      description: API Token.
  parameters:
    Authorization:
      in: header
      name: Authorization
      required: true
      schema:
        type: string
      description: Bearer token for authentication
  schemas:
    BrandfolderAttributes:
      title: Brandfolder attributes
      type: object
      properties:
        name:
          type: string
          description: The name of the brandfolder.
          example: Brandfolder
        privacy:
          type: string
          description: The privacy setting of the brandfolder.
          example: private
        slug:
          type: string
          description: The URL-friendly slug of the brandfolder.
          example: brandfolder
        tagline:
          type: string
          description: The tagline of the brandfolder.
          example: You expected this - Brandfolder's Brandfolder!
          default: ''
      required:
        - name
        - privacy
        - slug
        - tagline
    Brandfolder:
      title: Brandfolder
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the resource instance.
          example: oqgiju-21olts-ce9egi
        type:
          type: string
          description: The type of the resource.
          enum:
            - brandfolders
        attributes:
          $ref: '#/components/schemas/BrandfolderAttributes'
      required:
        - id
        - type
        - attributes
    PaginationMetadataResponse:
      title: Pagination metadata
      description: Page context information.
      type: object
      properties:
        current_page:
          type: integer
          format: int32
          example: 1
          minimum: 1
          default: 1
        next_page:
          type: object
          nullable: true
          example: null
          default: null
        prev_page:
          type: object
          nullable: true
          example: null
          default: null
        total_pages:
          example: 1
          minimum: 1
          default: 1
        total_count:
          example: 1
          minimum: 0
          default: 0
      required:
        - current_page
        - next_page
        - prev_page
        - total_pages
        - total_count
    CollectionAttributes:
      title: Collection attributes
      type: object
      properties:
        name:
          type: string
          description: The name of the collection.
          example: My collection
        tagline:
          type: string
          description: The tagline of the collection.
          example: My collection tag line
        slug:
          type: string
          description: The URL-friendly slug of the collection.
          example: my-collection
        public:
          type: boolean
          description: >-
            Set to `true` for hassle-free sharing, allowing search engines to
            index your brand assets. Otherwise, set to `false` to share only
            with the users you specify.
          example: false
          default: false
        stealth:
          type: boolean
          description: >-
            Set to `true` to remove the collection from appearing in web
            searches.
          example: false
          default: false
        is_workspace:
          type: boolean
          description: Set to `true` if the collection is a Brandfolder workspace.
          example: false
          default: false
    Collection:
      title: Collection
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the resource instance.
          example: oqgkkd-fr5iv4-hh142d
        type:
          type: string
          description: The type of the resource.
          enum:
            - collections
        attributes:
          $ref: '#/components/schemas/CollectionAttributes'
      required:
        - id
        - type
        - attributes
    CustomFieldKeyAttributes:
      title: Custom field key attributes
      type: object
      properties:
        name:
          type: string
          description: The key name.
          example: color
        allowed_values:
          type: array
          description: >-
            The `value` that can be used with this `key` when creating or
            updating any Custom Field on an Asset must be one of these strings.
            If not included or empty array `[]`, the `values` are unrestricted.
          items:
            type: string
          example:
            - red
            - white
            - blue
        position:
          type: integer
          format: int32
          description: >-
            Sets the location of the custom field among other custom fields in
            the Brandfolder UI.
          minimum: 0
          example: 0
        prioritized:
          type: boolean
          description: >-
            Set to `true` to display the custom field in asset previews. A
            Brandfolder can have up to five prioritized custom fields.
          example: false
        required:
          type: boolean
          description: >-
            If set to `true`, users uploading an asset must input the custom
            field before uploading the asset. Children of dependent custom
            fields can also be marked as required.
          example: false
        restricted:
          type: boolean
          description: >-
            If set to `true`, the field value is restricted to a set of allowed
            values (see `allowed_values`); otherwise, the field value is
            unrestricted.
          example: true
      required:
        - name
    CustomFieldKey:
      title: Custom field key
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the resource instance.
          example: plqlkk-22rw6g-3dqgx0
        type:
          type: string
          description: The type of the resource.
          enum:
            - custom_field_keys
        attributes:
          $ref: '#/components/schemas/CustomFieldKeyAttributes'
      required:
        - id
        - type
        - attributes
    OrganizationAttributes:
      title: Organization attributes
      type: object
      properties:
        name:
          type: string
          description: The name of the brandfolder.
          example: Brandfolder's Organization
        tagline:
          type: string
          description: The tagline of the brandfolder.
          example: An example tagline for the Organization
        slug:
          type: string
          description: The URL-friendly slug of the brandfolder.
          example: brandfolder-organization
    Organization:
      title: Organization
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the resource instance.
          example: oqgkkd-fr5iv4-cocc75
        type:
          type: string
          description: The type of the resource.
          enum:
            - organizations
        attributes:
          $ref: '#/components/schemas/OrganizationAttributes'
      required:
        - id
        - type
        - attributes
    AssetAttributes:
      title: Asset attributes
      type: object
      properties:
        name:
          type: string
          description: The name of the asset.
          example: Brandfolder Logo
        description:
          type: string
          description: The description of the asset.
          example: Brandfolder's logo in print ready format
        thumbnail_url:
          type: string
          description: The online location of the asset.
          example: https://example.com/example.jpg?Expires=1624742369
        approved:
          type: boolean
          description: If `true`, this asset is approved; otherwise, it's not.
          example: true
    Asset:
      title: Asset
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the resource instance.
          example: oqgkkd-fr5iv4-443db
        type:
          type: string
          description: The type of the resource.
          enum:
            - generic_files
        attributes:
          $ref: '#/components/schemas/AssetAttributes'
      required:
        - id
        - type
        - attributes
    AssetAttributesRequest:
      title: Asset attributes request body
      type: object
      properties:
        name:
          type: string
          description: The name of the asset.
          example: Brandfolder Logo
        description:
          type: string
          description: The description of the asset.
          example: Brandfolder's logo in print ready format
        thumbnail_url:
          type: string
          description: The online location of the asset.
          example: https://example.com/example.jpg?Expires=1624742369
        approved:
          type: boolean
          description: If `true`, this asset is approved; otherwise, it's not.
          example: true
        availability_start:
          type: string
          format: date-time
          description: >
            This represents the publish/availability date in Brandfolder, the
            label `draft` will show.
          example: '2024-02-23T18:22:49.771Z'
        availability_end:
          type: string
          format: date-time
          description: >
            This represents the expiration date in brandfolder, the label
            `expired` will show.
          example: '2025-02-23T18:22:49.771Z'
        attachments:
          description: >
            An array of Attachment objects to add to the Asset (these do not
            overwrite exisiting Attachments).
          type: array
          items:
            type: object
            properties:
              url:
                type: string
                description: >
                  A fully-formed URL of the file to upload (required for each
                  new Attachment).
                example: https://example.com/new-attachment.jpg
              filename:
                type: string
                description: A complete file name, with extension.
                example: new-attachment.jpg
            required:
              - url
      required:
        - name
    TagAttributes:
      title: Tag attributes
      type: object
      properties:
        name:
          type: string
          description: >
            A keyword associated with exactly one asset.


            For example, if you have several assets that represent products you
            sell, you might create a "product" tag for each one. If you modify
            or delete the "product" tag for any particular Asset, it doesn't
            affect other tags with the same value on other assets.
          example: product
        auto_generated:
          type: boolean
          description: >-
            If `true`, this tag was generated automatically by our smart
            analysis of file attachments; otherwise, a user created it.
          example: true
        source:
          type: string
          nullable: true
          description: The tag author.
          example: google_vision
          default: null
      required:
        - name
    Tag:
      title: Tag
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the resource instance.
          example: a3dlao-hd6so4-7d91d2
        type:
          type: string
          description: The type of the resource.
          enum:
            - tags
        attributes:
          $ref: '#/components/schemas/TagAttributes'
      required:
        - id
        - type
        - attributes
    SectionAttributes:
      title: Section attributes
      type: object
      properties:
        name:
          type: string
          description: The name of the section.
          example: My section
        default_asset_type:
          type: string
          description: |
            The type of asset the section contains.
          enum:
            - GenericFile
            - Color
            - Font
            - ExternalMedium
            - Person
            - Press
            - Text
          example: GenericFile
        position:
          type: integer
          minimum: 0
          description: >
            A non-negative integer that represents where the section displays
            relative to other sections. The first position is `0`.
          example: 0
    Section:
      title: Section
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the resource instance.
          example: oqgkkd-fr5iv4-hh142d
        type:
          type: string
          description: The type of the resource.
          enum:
            - sections
        attributes:
          $ref: '#/components/schemas/SectionAttributes'
      required:
        - id
        - type
        - attributes
    CustomFieldValueAttributes:
      title: Custom field value attributes
