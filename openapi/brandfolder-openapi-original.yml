            the `meta.total_count` value).
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 3000
            default: 100
        - in: query
          name: search
          description: |
            Set it to any URL-encoded query to fetch only assets that match your
            criteria.

            WARNING: This parameter can slow response times.
          schema:
            type: string
          example: extension:png
        - in: query
          name: fields
          description: >
            Set it to a comma-separated list (no spaces) of any of the following

            attributes of the asset to return as part of the asset's attributes
            in

            the response.


            Allowed values: 


            - `created_at`

            - `updated_at`

            - `cdn_url`

            - `availability`


            WARNING: This parameter can slow response times.
          schema:
            type: string
          example: cdn_url
        - in: query
          name: include
          description: |
            Set it to a comma-separated list (no spaces) of any of the following
            record names to return those records related to the asset you're
            fetching. Related records are returned in an `included` array in the
            response.

