          properties:
            attributes:
              type: object
              properties:
                email:
                  type: string
                  description: Email address of invitee.
                  example: test@example.com
                permission_level:
                  type: string
                  description: >
                    Access to grant invitee.


                    > **Note:** `owner` is only valid when inviting someone to
                    an Organization.


                    Learn more about the permission levels you can grant Users
                    in our Knowledge Base article on <a
                    href="https://help.smartsheet.com/115002602273-User-Permissions"
                    target="_blank">User Permissions</a>.
                  enum:
                    - guest
                    - collaborator
                    - admin
                    - owner
                  example: guest
                personal_message:
                  type: string
                  description: A message for invitee.
                  example: Welcome to my Brandfolder!
                prevent_email:
                  type: boolean
                  description: >-
                    Set this to `true` to skip sending an invitation email to
                    the invitee.
                  default: false
              required:
                - email
                - permission_level
          required:
            - attributes
      required:
        - data
