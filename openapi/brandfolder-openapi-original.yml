        in

        use. Changing allowed values or whether they are restricted after other

        values have already been used can lead to undesirable results.
      tags:
        - custom_fields
      parameters:
        - in: header
          name: Accept
          required: true
          schema:
            type: string
            enum:
              - application/json
          example: application/json
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        name:
                          type: string
                          description: The key name.
                          example: color
                        allowed_values:
                          type: array
                          description: >-
                            The `value` that can be used with this `key` when
                            creating or updating any Custom Field on an Asset
                            must be one of these strings. If not included or
                            empty array `[]`, the `values` are unrestricted.
                          items:
