- aid: brandfolder:brandfolder-binary-upload-api
  name: Brandfolder Binary Upload API
  description: "Brandfolder's Binary Upload service allows for authenticated users to upload locally stored\
    \ files into Brandfolder via our API.\n\nBinary Upload is a multi-step process:\n\n1.  [Get an upload\
    \ URL](/api/brandfolder/openapi/binary_upload/opidstorageserviceuploadrequestsget)\n2.  Upload the\
    \ file to the storage bucket using one of the methods below : \n    - [Upload a file](/api/brandfolder/openapi/binary_upload/opidstorageservicebfuploadrequestbucketput)\n\
    \    - [Resumable upload](/api/brandfolder/openapi/binary_upload/opidstorageservicebfuploadrequestpost)\n\
    3.  [Create an asset](/api/brandfolder/openapi/assets/opidapiv4collectionsassetsbybrandfolderidpost),\
    \ telling the Brandfolder API the attachment is at that URL.\n\nThe Brandfolder Upload Request endpoint\
    \ will return a response body with a signed `upload_url`, `resumable_upload_url`, storage `service_type`\
    \ and `object_url`.\n\nEach Binary Upload `request_url` and `object_url` are designed to be used one\
    \ time for a singular Asset. Both the `upload_url` and `resumable_upload_url` will expire 24 hours\
    \ after they're issued. Assets uploaded to the `object_url` will be stored for 7 days before being\
    \ purged. Should any of these URLs expire, you will simply need to restart the workflow to obtain\
    \ active URLs. \n\n> **Tip:** We recommend that you use the Resumable Upload flow if you have poor\
    \ internet connection, you're uploading local files that are larger than 200MB or if you're uploading\
    \ files from a server that are larger than 500MB.\n\n![Upload Request Flow](../images/bf-upload-request-interactions.png)"
