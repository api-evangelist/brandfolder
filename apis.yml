- aid: brandfolder:brandfolder-custom-fields-api
  name: Brandfolder Custom Fields API
  description: >-
    Custom Fields can be assigned to Assets and are generally helpful for organizing and searching Assets
    within a Brandfolder, as well as for understanding more details about each Asset.


    Each Custom Field is essentially a key/value pair associated with **exactly one Asset**. Keys and
    values are always a string type, so use `"123"` instead of `123`.


    For example, if you have several Assets that represent products you sell in different colors, you
    might create a Custom Field for each of those Assets with a key of `"color"` and a value of `"blue"`
    or `"red"`, etc. If you modify or delete a `"color":"blue"` Custom Field for any particular Asset,
    it will not affect other Custom Fields on other Assets, even if they have the same key and/or value.


    > **IMPORTANT:** Think carefully about whether Tags or Custom Fields are better suited to meet the
    needs of your particular use case.
  humanURL: https://developers.smartsheet.com/api/brandfolder
