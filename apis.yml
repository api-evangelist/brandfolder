- aid: brandfolder:brandfolder-tags-api
  name: Brandfolder Tags API
  description: >-
    Tags can be assigned to Assets and are generally helpful for organizing and searching Assets within
    a Brandfolder.


    Each Tag is essentially a keyword associated with exactly one Asset.


    For example, if you have several Assets that represent products you sell, you might create a "product"
    Tag for each one. If you modify or delete the "product" Tag for any particular Asset, it will not
    affect other Tags with the same value on other Assets.


    Tags have a read-only attribute called `auto_generated` which indicates if the Tag was created automatically
    by our smart analysis of the file Attachment(s) (`true`) or if a User created the Tag (`false`).


    > **IMPORTANT:** Think carefully about whether Tags or Custom Fields are better suited to meet the
    needs of your particular use case.
