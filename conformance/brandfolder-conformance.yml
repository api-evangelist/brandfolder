    conforms: false
    evidence: >
      Envelope is JSON:API-shaped (data / included / relationships / attributes,
      type + id per resource) but the media type is application/json not
      application/vnd.api+json, pagination is page/per rather than page[number]/
      page[size], and errors are not JSON:API error objects. Flavoured, not conformant.
