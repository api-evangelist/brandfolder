  - id: rfc9110-idempotency
    conforms: false
    evidence: no idempotency key documented; no Idempotency-Key parameter in the spec across 30 write operations
  - id: rate-limit-headers
    conforms: false
    evidence: no RateLimit-* / X-RateLimit-* / Retry-After headers documented or declared; 429 documented in prose only
  - id: pagination
    conforms: true
